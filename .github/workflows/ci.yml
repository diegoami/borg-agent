name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev > /dev/null
      - run: bash scripts/setup.sh --strict
      - run: pip install -q -e '.[test]'
      - run: python -m pytest -q
