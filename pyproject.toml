[project]
name = "borg-agent"
version = "0.0.0"
description = "An agent that plays Angband through the C Borg's connection and records what it learns"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The slow marker is the headless build and play (T01): a compiler, CMake,
# libx11-dev and a few minutes. Run it with: pytest -m slow
addopts = "-m 'not slow'"
markers = ["slow: builds the pinned game and plays it"]
